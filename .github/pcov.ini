; The coverage job in workflows/main.yml copies this file into the wiki
; container. Without pcov.directory, PCOV would track all of MediaWiki:
; PHPUnit runs from the MediaWiki root, which has none of the src/, lib/ or
; app/ directories PCOV looks for.
pcov.directory=/var/www/html/extensions/SemanticMediaWiki
pcov.exclude="~/(vendor|tests|node_modules)/~"
